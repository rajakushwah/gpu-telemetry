apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "gt.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector: {{- include "gt.labels" (dict "root" . "component" "api") | nindent 4 }}
  ports: [{ name: http, port: {{ .Values.api.service.port }}, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "gt.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "gt.labels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "gt.labels" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      containers:
        - name: api
          {{- include "gt.image" . | nindent 10 }}
          command: ["api"]
          {{- include "gt.securityContext" . | nindent 10 }}
          env: {{- include "gt.dbEnv" . | nindent 12 }}
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /readyz, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 10 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
