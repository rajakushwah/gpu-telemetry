{{- if not .Values.timescaledb.existingSecret }}
{{- /* Generate a random password once and keep it across upgrades. */}}
{{- $name := printf "%s-db" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "gt.labels" (dict "root" . "component" "timescaledb") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ if $existing }}{{ index $existing.data "password" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
{{- end }}
