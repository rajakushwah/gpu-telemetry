apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-timescaledb
  labels: {{- include "gt.labels" (dict "root" . "component" "timescaledb") | nindent 4 }}
spec:
  selector: {{- include "gt.labels" (dict "root" . "component" "timescaledb") | nindent 4 }}
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-timescaledb
  labels: {{- include "gt.labels" (dict "root" . "component" "timescaledb") | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-timescaledb
  replicas: 1
  selector:
    matchLabels: {{- include "gt.labels" (dict "root" . "component" "timescaledb") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "gt.labels" (dict "root" . "component" "timescaledb") | nindent 8 }}
    spec:
      securityContext: { fsGroup: 999 }
      containers:
        - name: timescaledb
          image: {{ .Values.timescaledb.image }}
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: {{ .Values.timescaledb.user | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.timescaledb.database | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "gt.dbSecret" . }}, key: password } }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.timescaledb.user | quote }}] }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.timescaledb.storage }} } }
